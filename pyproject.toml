[project]
name = "typeql"
version = "0.1.0"
description = "Type-oriented analytical query language that compiles to SQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "lark",
  "pydantic>=2.12.4",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "ruff>=0.12.4",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
cache-dir = ".ruff_cache"
respect-gitignore = true
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]
include = ["typeql*"]
