[project]
name = "test-uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pandas-stubs>=2.3.0.250703",
  "pandas>=2.3.1",
  "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "ruff>=0.12.4",
]

[tool.ruff]
cache-dir = ".ruff_cache"
respect-gitignore = true
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
